<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Números</title>
</head>
<body>
    <h1>Somando Valores</h1>

    <input type="number" name="txt1" id="txt1"> + 
    <input type="number" name="txt2" id="txt2">
    <input type="button" value="Somar" onclick="somar()">
    <div id="res">Resultado</div>

    <script>
        function somar(){
            var cx1 = document.getElementById('txt1');
            var cx2 = document.getElementById('txt2');
            var res = document.getElementById('res');
            var n1 = Number(cx1.value);
            var n2 = Number(cx2.value);
            var soma = n1 + n2

            res.innerHTML = `O resultado da soma entre ${n1} e ${n2} é <strong>${soma}</strong>`;
        }
    </script>
</body>
</html>
