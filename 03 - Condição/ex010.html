<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    Velocidade do carro: <input type="text" name="txtvel" id="txtvel"> km/h
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="res"></div>

    <script>
        function verificar(){
            var txtv = document.getElementById("txtvel")
            var res = document.getElementById("res")
            var vel = Number(txtv.value)
            
            res.innerHTML = `<p>A sua velocidade registrada foi: <strong>${vel}</strong>km/h</p>`
            if (vel > 80){
                res.innerHTML += '<p>Você ultrapassou o limite de velocidade da via, <strong>MULTADO</strong></p>'
            }
            res.innerHTML += '<p>Dirija com cuidado!</p>'
            
        }
    </script>
</body>
</html>
