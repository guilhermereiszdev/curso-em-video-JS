<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pais</title>
</head>
<body>
    Digite o seu pais: <input type="text" name="pais" id="pais">
    <input type="button" value="Enviar" onclick="verificar()">
    <div id="res"></div>

    <script>
        function verificar(){
            var pais = document.getElementById("pais").value
            var res = document.getElementById("res")

            res.innerHTML = `<p>O seu pais é: ${pais}`
                if (pais == "Brasil") {
                    res.innerHTML += `<p>Você é brasileiro`
                } else {
                    res.innerHTML += `<p>Você é estrangeiro`
                }
        }
    </script>
</body>
</html>
